[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etica-ia-ers"
version = "0.1.0"
description = "Prototipo académico para revisión ética temprana de ERS de sistemas de IA."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "TPP" }
]
dependencies = [
  "pypdf>=5.0",
  "python-docx>=1.1",
  "fastapi>=0.111.1",
  "python-multipart>=0.0.6",
  "spacy==3.8.7",
  "thinc==8.3.6",
  "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
  "uvicorn[standard]>=0.23.2"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["codigo_fuente"]
testpaths = ["pruebas"]
python_files = ["prueba_*.py"]
python_functions = ["prueba_*"]

[tool.setuptools.packages.find]
where = ["codigo_fuente"]
