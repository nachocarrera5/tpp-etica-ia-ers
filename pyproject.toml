[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etica-ia-ers"
version = "0.1.0"
description = "Prototipo académico para revisión ética temprana de ERS de sistemas de IA."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "TPP" }
]
dependencies = [
  "pypdf>=5.0",
  "python-docx>=1.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
